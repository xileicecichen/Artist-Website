name: Automate Website Deployment

on:
  push:
    branches:
      - main # This tells GitHub to run this script every time you push code to main

# This gives the script permission to push the compiled code to your gh-pages branch
permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20 # This automatically uses a modern Node engine to prevent that Vite crypto error!

      - name: Install dependencies
        run: npm install

      - name: Build the website with Secrets
        run: npm run build
        env: # This is the magic! GitHub injects your secrets securely during the build.
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Preserve Custom Domain
        run: echo 'xileicecichen.com' > dist/CNAME

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
